<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>RONT WEB APPS — Login V6 True Fullscreen</title>

  <style>
    /* ============================================================
       RONT WEB APPS — PREMIUM LOGIN REDESIGN V6 TRUE FULLSCREEN
       Theme : TelkomAkses / IndiHome
       Style : Compact • Glassmorphism • 3D • Professional

       DUAL THEME (v6.13): default tampilan = LIGHT (didefinisikan di
       :root). Mode gelap yang lama sepenuhnya dipertahankan, tinggal
       aktif lewat atribut [data-theme="dark"] di <body> (tombol toggle
       matahari/bulan di pojok kanan atas). TIDAK disimpan ke
       localStorage secara sengaja — tampilan awal SELALU light setiap
       halaman dibuka, sesuai permintaan.
       ============================================================ */

    :root {
      --red: #e30613;
      --red-2: #ff2635;
      --red-dark: #a9000b;
      --navy: #07192f;
      --navy-deep: #020b18;
      --white: #ffffff;
      --text-soft: rgba(20,30,45,.68);
      --text-muted: rgba(20,30,45,.48);
      --line: rgba(20,30,45,.13);

      /* -- Variabel tema (LIGHT, default) -- */
      --page-bg: #EAF4FE;
      --veil-color: rgba(224,240,255,0);
      --card-bg-1: rgba(255,255,255,.86);
      --card-bg-2: rgba(255,255,255,.72);
      --card-border: rgba(20,30,45,.10);
      --card-top-line: rgba(20,30,45,.16);
      --card-shadow-1: rgba(20,30,45,.10);
      --card-shadow-2: rgba(20,30,45,.14);
      --card-shadow-3: rgba(20,30,45,.16);
      --card-glow: rgba(227,6,19,.06);
      --title-color: #101828;
      --field-label: rgba(20,30,45,.56);
      --field-bg-1: rgba(20,30,45,.045);
      --field-bg-2: rgba(20,30,45,.02);
      --field-border: rgba(20,30,45,.13);
      --field-border-hover: rgba(20,30,45,.24);
      --field-placeholder: rgba(20,30,45,.36);
      --field-icon: rgba(20,30,45,.42);
      --field-shadow-1: rgba(255,255,255,.55);
      --field-shadow-2: rgba(20,30,45,.05);
      --field-focus-bg: rgba(20,30,45,.06);
      --toggle-pass: rgba(20,30,45,.42);
      --toggle-pass-hover: #101828;
      --toggle-pass-hover-bg: rgba(20,30,45,.07);
      --checkbox-border: rgba(20,30,45,.26);
      --checkbox-bg: rgba(20,30,45,.03);
      --security-text: rgba(20,30,45,.38);
      --footer-line: rgba(20,30,45,.10);
      --footer-text: rgba(20,30,45,.34);
      --footer-brand: rgba(20,30,45,.52);
      --ambient-glow-mobile: rgba(255,255,255,.10);
      --theme-toggle-bg: rgba(255,255,255,.75);
      --theme-toggle-border: rgba(20,30,45,.12);
      --theme-toggle-icon: #344054;
      --theme-toggle-shadow: rgba(20,30,45,.14);
      --badge-text: #c81525;
      --title-accent: #d81c28;
      --alert-error-text: #b3261e;
      --alert-error-bg: rgba(227,6,19,.08);
      --alert-error-border: rgba(227,6,19,.22);
      --alert-success-text: #067a4d;
      --alert-success-bg: rgba(16,185,129,.10);
      --alert-success-border: rgba(16,185,129,.28);
    }

    [data-theme="dark"] {
      --text-soft: rgba(255,255,255,.68);
      --text-muted: rgba(255,255,255,.43);
      --line: rgba(255,255,255,.13);

      /* -- Variabel tema (DARK, tampilan lama) -- */
      --page-bg: var(--navy-deep);
      --veil-color: rgba(2,11,24,0);
      --card-bg-1: rgba(10,31,57,.91);
      --card-bg-2: rgba(3,13,29,.84);
      --card-border: rgba(255,255,255,.16);
      --card-top-line: rgba(255,255,255,.72);
      --card-shadow-1: rgba(255,255,255,.16);
      --card-shadow-2: rgba(0,0,0,.30);
      --card-shadow-3: rgba(0,0,0,.46);
      --card-glow: rgba(227,6,19,.08);
      --title-color: #ffffff;
      --field-label: rgba(255,255,255,.55);
      --field-bg-1: rgba(255,255,255,.085);
      --field-bg-2: rgba(255,255,255,.035);
      --field-border: rgba(255,255,255,.11);
      --field-border-hover: rgba(255,255,255,.20);
      --field-placeholder: rgba(255,255,255,.34);
      --field-icon: rgba(255,255,255,.47);
      --field-shadow-1: rgba(255,255,255,.04);
      --field-shadow-2: rgba(0,0,0,.13);
      --field-focus-bg: rgba(255,255,255,.095);
      --toggle-pass: rgba(255,255,255,.48);
      --toggle-pass-hover: #fff;
      --toggle-pass-hover-bg: rgba(255,255,255,.08);
      --checkbox-border: rgba(255,255,255,.28);
      --checkbox-bg: rgba(255,255,255,.04);
      --security-text: rgba(255,255,255,.32);
      --footer-line: rgba(255,255,255,.08);
      --footer-text: rgba(255,255,255,.30);
      --footer-brand: rgba(255,255,255,.40);
      --ambient-glow-mobile: rgba(2,10,22,.08);
      --theme-toggle-bg: rgba(10,25,45,.55);
      --theme-toggle-border: rgba(255,255,255,.18);
      --theme-toggle-icon: #ffffff;
      --theme-toggle-shadow: rgba(0,0,0,.35);
      --badge-text: #ff7b82;
      --title-accent: #ff3d48;
      --alert-error-text: #ffb1b6;
      --alert-error-bg: rgba(227,6,19,.10);
      --alert-error-border: rgba(255,80,90,.22);
      --alert-success-text: #9ff0c0;
      --alert-success-bg: rgba(16,185,129,.10);
      --alert-success-border: rgba(16,185,129,.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--page-bg);
      font-family: "Poppins", "Segoe UI", Arial, sans-serif;
      color: var(--title-color);
      transition: background-color .25s ease, color .25s ease;
    }

    button, input {
      font: inherit;
    }


    /* ============================================================
       V5 SMART RESPONSIVE WALLPAPER
       Strategi:
       1. Rasio normal -> object-fit: cover (fullscreen)
       2. Rasio ekstrem -> gambar utama tampil utuh + background
          fill yang diblur, sehingga tetap fullscreen tanpa area kosong.
       ============================================================ */

    .wallpaper-stage,
    .wallpaper-picture {
      position: fixed;
      inset: 0;
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      z-index: 0;
      overflow: hidden;
      display: block;
      background: #07192f;
    }

    .wallpaper-picture {
      position: absolute;
      z-index: 2;
    }

    .wallpaper-fill {
      position: absolute;
      inset: -5%;
      z-index: 1;
      overflow: hidden;
      opacity: 0;
      transition: opacity .35s ease;
      background: #07192f;
    }

    .wallpaper-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(2,11,24,.32), transparent 22%, transparent 78%, rgba(2,11,24,.32)),
        rgba(3,12,28,.18);
    }

    .wallpaper-fill-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
      filter: blur(18px) saturate(1.08) brightness(.72);
      transform: scale(1.08);
    }

    .wallpaper-image {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      user-select: none;
      pointer-events: none;
    }

    /* Aktif otomatis oleh JavaScript bila rasio viewport terlalu
       berbeda dengan rasio wallpaper terpilih. */
    .wallpaper-stage.smart-fit .wallpaper-fill {
      opacity: 1;
    }

    .wallpaper-stage.smart-fit .wallpaper-image {
      object-fit: contain;
    }

    /* Posisi aman per kategori perangkat */
    @media (max-width: 767px) and (orientation: portrait) {
      .wallpaper-image { object-position: center center; }
    }

    @media (min-width: 768px) and (max-width: 1199px) {
      .wallpaper-image { object-position: center center; }
    }

    @media (min-width: 1200px) {
      .wallpaper-image { object-position: center 48%; }
    }

    /* glow tambahan agar background di luar area gambar tetap premium.
       --veil-color menambahkan lapisan tipis di atas foto wallpaper:
       transparan di dark mode (tampilan asli), putih lembut di light
       mode supaya foto tidak terlalu gelap dan kartu login tetap kontras. */
    .ambient-glow {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 72% 68%, rgba(227,6,19,.08), transparent 25%),
        radial-gradient(circle at 88% 70%, rgba(0,123,255,.10), transparent 28%),
        linear-gradient(var(--veil-color), var(--veil-color));
      transition: background-color .25s ease;
    }

    /* ============================================================
       TOGGLE TEMA (pojok kanan atas)
       ============================================================ */
    .theme-toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 20;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--theme-toggle-border);
      background: var(--theme-toggle-bg);
      color: var(--theme-toggle-icon);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px var(--theme-toggle-shadow);
      transition: background-color .25s ease, border-color .25s ease, color .25s ease, transform .18s ease;
    }

    .theme-toggle-btn:hover {
      transform: translateY(-1px) scale(1.04);
    }

    .theme-toggle-btn svg {
      width: 19px;
      height: 19px;
    }

    @media (max-width: 480px) {
      .theme-toggle-btn {
        top: 14px;
        right: 14px;
        width: 38px;
        height: 38px;
      }
      .theme-toggle-btn svg {
        width: 17px;
        height: 17px;
      }
    }

    /* ============================================================
       MAIN LAYOUT
       ============================================================ */
    .login-page {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 28px clamp(24px, 6vw, 110px);
      perspective: 1400px;
    }

    /* ============================================================
       LOGIN CARD
       ============================================================ */
    .login-card {
      position: relative;
      width: min(100%, 390px);
      padding: 28px 28px 24px;
      border-radius: 24px;
      overflow: hidden;

      background:
        linear-gradient(145deg,
          var(--card-bg-1),
          var(--card-bg-2));

      border: 1px solid var(--card-border);

      -webkit-backdrop-filter: blur(18px) saturate(125%);
      backdrop-filter: blur(18px) saturate(125%);

      transform: rotateY(-2deg) rotateX(1deg);

      box-shadow:
        inset 0 1px 0 var(--card-shadow-1),
        inset 0 -1px 0 var(--card-shadow-2),
        0 3px 8px var(--card-shadow-2),
        0 14px 34px var(--card-shadow-2),
        0 36px 80px var(--card-shadow-3),
        0 0 55px var(--card-glow);

      transition: background-color .25s ease, border-color .25s ease, box-shadow .25s ease;

      animation: cardEnter .65s cubic-bezier(.22,.8,.22,1) both;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 11%;
      width: 78%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent,
        var(--card-top-line),
        transparent);
    }

    .login-card::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      top: -145px;
      right: -105px;
      border-radius: 50%;
      background: rgba(227,6,19,.12);
      filter: blur(30px);
      pointer-events: none;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(22px) rotateY(-4deg) rotateX(2deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotateY(-2deg) rotateX(1deg);
      }
    }

    /* shake error */
    .card-shake {
      animation: shake .42s ease both !important;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) rotateY(-2deg); }
      20% { transform: translateX(-10px) rotateY(-2deg); }
      40% { transform: translateX(10px) rotateY(-2deg); }
      60% { transform: translateX(-7px) rotateY(-2deg); }
      80% { transform: translateX(7px) rotateY(-2deg); }
    }

    /* ============================================================
       BRAND
       ============================================================ */
    .brand-area {
      position: relative;
      z-index: 2;
      margin-bottom: 22px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 11px;
      margin-bottom: 14px;
      border-radius: 999px;
      background: rgba(227,6,19,.13);
      border: 1px solid rgba(255,70,80,.30);
      color: var(--badge-text);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.25px;
      text-transform: uppercase;
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red-2);
      box-shadow: 0 0 12px rgba(255,38,53,.85);
    }

    .brand-title {
      font-size: 26px;
      line-height: 1.15;
      font-weight: 750;
      letter-spacing: -.7px;
      color: var(--title-color);
      transition: color .25s ease;
    }

    .brand-title strong {
      color: var(--title-accent);
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 7px;
      max-width: 300px;
      font-size: 11.5px;
      line-height: 1.65;
      color: var(--text-soft);
    }

    /* ============================================================
       FORM
       ============================================================ */
    .login-form {
      position: relative;
      z-index: 2;
    }

    .field-group {
      display: grid;
      gap: 11px;
    }

    .field-wrap {
      position: relative;
    }

    .field-label {
      display: block;
      margin: 0 0 6px 2px;
      font-size: 10px;
      font-weight: 600;
      color: var(--field-label);
      letter-spacing: .25px;
    }

    .field-input {
      width: 100%;
      height: 47px;
      padding: 0 45px 0 43px;
      border: 1px solid var(--field-border);
      border-radius: 13px;

      background:
        linear-gradient(145deg,
          var(--field-bg-1),
          var(--field-bg-2));

      color: var(--title-color);
      outline: none;

      font-size: 12.5px;

      box-shadow:
        inset 0 1px 1px var(--field-shadow-1),
        inset 0 -2px 6px var(--field-shadow-2);

      transition:
        border-color .22s ease,
        background .22s ease,
        box-shadow .22s ease,
        transform .22s ease,
        color .22s ease;
    }

    .field-input::placeholder {
      color: var(--field-placeholder);
    }

    .field-input:hover {
      border-color: var(--field-border-hover);
    }

    .field-input:focus {
      border-color: rgba(255,54,67,.82);
      background: var(--field-focus-bg);
      box-shadow:
        0 0 0 3px rgba(227,6,19,.13),
        inset 0 1px 1px var(--field-shadow-1),
        inset 0 -2px 6px var(--field-shadow-2);
    }

    .field-wrap:focus-within .field-icon {
      color: var(--title-accent);
      transform: translateY(-50%) scale(1.05);
    }

    .field-icon {
      position: absolute;
      left: 15px;
      bottom: 14px;
      width: 18px;
      height: 18px;
      color: var(--field-icon);
      pointer-events: none;
      transition: color .2s ease, transform .2s ease;
    }

    .toggle-password {
      position: absolute;
      right: 9px;
      bottom: 8px;
      width: 31px;
      height: 31px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--toggle-pass);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: .2s ease;
    }

    .toggle-password:hover {
      color: var(--toggle-pass-hover);
      background: var(--toggle-pass-hover-bg);
    }

    .toggle-password svg {
      width: 17px;
      height: 17px;
    }

    /* ============================================================
       OPTIONS
       ============================================================ */
    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 15px 1px 18px;
    }

    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 10.5px;
      color: var(--text-muted);
      user-select: none;
    }

    .remember-label input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .custom-check {
      position: relative;
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      border-radius: 5px;
      border: 1px solid var(--checkbox-border);
      background: var(--checkbox-bg);
      transition: .18s ease;
    }

    .remember-label input:checked + .custom-check {
      background: var(--red);
      border-color: var(--red);
      box-shadow: 0 0 10px rgba(227,6,19,.25);
    }

    .remember-label input:checked + .custom-check::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 4px;
      height: 7px;
      border: solid #fff;
      border-width: 0 1.7px 1.7px 0;
      transform: rotate(45deg);
    }

    .security-note {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9.5px;
      color: var(--security-text);
    }

    .security-note svg {
      width: 13px;
      height: 13px;
    }

    /* ============================================================
       BUTTON
       ============================================================ */
    .btn-login {
      position: relative;
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 13px;
      overflow: hidden;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      color: #fff;
      font-size: 12.5px;
      font-weight: 750;
      letter-spacing: .35px;

      background:
        linear-gradient(135deg,
          #f20c1a 0%,
          #d9000d 50%,
          #a9000b 100%);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.28),
        inset 0 -2px 3px rgba(0,0,0,.16),
        0 7px 18px rgba(227,6,19,.30),
        0 2px 4px rgba(0,0,0,.22);

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.30),
        inset 0 -2px 3px rgba(0,0,0,.16),
        0 12px 26px rgba(227,6,19,.42),
        0 3px 6px rgba(0,0,0,.25);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-login:disabled {
      opacity: .75;
      cursor: not-allowed;
    }

    .btn-login .btn-arrow {
      width: 17px;
      height: 17px;
      transition: transform .2s ease;
    }

    .btn-login:hover .btn-arrow {
      transform: translateX(3px);
    }

    .btn-spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.32);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,.30);
      transform: scale(0);
      pointer-events: none;
      animation: rippleOut .65s linear forwards;
    }

    @keyframes rippleOut {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    /* ============================================================
       ALERT
       ============================================================ */
    .alert-box {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 13px;
      padding: 9px 11px;
      border-radius: 11px;
      font-size: 10.5px;
      line-height: 1.4;
      animation: alertIn .25s ease both;
    }

    .alert-box.show {
      display: flex;
    }

    .alert-box.error {
      color: var(--alert-error-text);
      background: var(--alert-error-bg);
      border: 1px solid var(--alert-error-border);
    }

    .alert-box.success {
      color: var(--alert-success-text);
      background: var(--alert-success-bg);
      border: 1px solid var(--alert-success-border);
    }

    .alert-box svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    @keyframes alertIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    .card-footer {
      position: relative;
      z-index: 2;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--footer-line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--footer-text);
      font-size: 9px;
    }

    .footer-brand {
      font-weight: 700;
      letter-spacing: .5px;
      color: var(--footer-brand);
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 900px) {
      .login-page {
        padding-right: 4vw;
      }

      .login-card {
        transform: none;
      }
    }

    @media (max-width: 680px) {
      html, body {
        overflow: auto;
      }

      .wallpaper-stage,
      .wallpaper-picture {
        height: 100svh;
      }

      .wallpaper-image {
        height: 100%;
        object-fit: cover;
        object-position: center center;
      }

      .login-page {
        min-height: 100svh;
        height: auto;
        align-items: center;
        justify-content: center;
        padding: 16px 16px max(18px, env(safe-area-inset-bottom));
      }

      .login-card {
        width: min(100%, 430px);
        padding: 24px 22px 20px;
        border-radius: 21px;
        background:
          linear-gradient(145deg,
            var(--card-bg-1),
            var(--card-bg-2));
      }

      .brand-title {
        font-size: 23px;
      }
    }

    @media (max-width: 390px) {
      .login-card {
        padding: 21px 18px 18px;
      }

      .brand-area {
        margin-bottom: 17px;
      }

      .login-options {
        margin: 12px 1px 15px;
      }
    }

    /* ============================================================
       V5 RESPONSIVE LOGIN POSITIONING
       ============================================================ */

    /* Tablet landscape / medium desktop */
    @media (min-width: 681px) and (max-width: 1199px) {
      .login-page {
        justify-content: flex-end;
        padding: 24px clamp(22px, 4vw, 56px);
      }

      .login-card {
        width: min(100%, 380px);
        transform: none;
      }
    }

    /* Short laptop screens */
    @media (min-width: 1200px) and (max-height: 820px) {
      .login-page {
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .login-card {
        transform: scale(.94) rotateY(-1.5deg);
        transform-origin: center right;
      }
    }

    /* Ultrawide / unusual desktop ratio */
    @media (min-aspect-ratio: 2/1) and (min-width: 1200px) {
      .login-page {
        padding-right: clamp(32px, 7vw, 140px);
      }
    }

    /* Mobile landscape: form compact dan tetap mudah dijangkau */
    @media (max-height: 620px) and (orientation: landscape) {
      html, body { overflow: auto; }

      .login-page {
        min-height: 100svh;
        height: auto;
        align-items: center;
        padding: 14px 24px;
      }

      .login-card {
        width: min(100%, 360px);
        padding: 18px 20px 16px;
        transform: none;
      }

      .brand-area { margin-bottom: 13px; }
      .brand-badge { margin-bottom: 8px; }
      .brand-title { font-size: 21px; }
      .brand-subtitle { display: none; }
      .field-input { height: 42px; }
      .login-options { margin: 10px 1px 12px; }
      .login-button { height: 48px; }
      .card-footer { margin-top: 13px; padding-top: 11px; }
    }

    @media (max-width: 480px) {
      .ambient-glow { background: linear-gradient(var(--veil-color), var(--veil-color)); }
    }

  
    /* ============================================================
       V6 TRUE FULLSCREEN WALLPAPER
       Selalu memenuhi seluruh viewport. Tidak ada contain/smart-fit.
       ============================================================ */
    .wallpaper-stage,
    .wallpaper-picture {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      min-width: 100vw !important;
      min-height: 100dvh !important;
      overflow: hidden !important;
    }

    .wallpaper-fill {
      display: none !important;
    }

    .wallpaper-image,
    .wallpaper-stage.smart-fit .wallpaper-image {
      position: absolute !important;
      inset: 0 !important;
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 100% !important;
      min-height: 100% !important;
      object-fit: cover !important;
      object-position: center center !important;
      max-width: none !important;
      max-height: none !important;
    }

    @media (max-width: 767px) and (orientation: portrait) {
      .wallpaper-image { object-position: center center !important; }
    }

    @media (min-width: 768px) and (max-width: 1199px) {
      .wallpaper-image { object-position: center center !important; }
    }

    @media (min-width: 1200px) {
      .wallpaper-image { object-position: center center !important; }
    }


    /* ============================================================
       V7 ULTRAWIDE / SHORT LAPTOP VIEWPORT FIX
       Untuk layar sangat lebar atau pendek (contoh 1919 x 868),
       object-fit: cover akan memangkas bagian atas & bawah wallpaper.
       Agar seluruh artwork/logo tetap terlihat dan wallpaper tetap
       memenuhi viewport, gunakan fill hanya pada rasio ultra-wide.
       ============================================================ */
    @media (min-aspect-ratio: 19/9) {
      .wallpaper-image,
      .wallpaper-stage.smart-fit .wallpaper-image {
        object-fit: fill !important;
        object-position: center center !important;
      }
    }

</style>
</head>

<body data-theme="light">

  <!-- ==========================================================
       WALLPAPER
       Gambar sudah di-embed langsung ke file ini (Base64).
       Tidak membutuhkan Google Drive, URL eksternal, atau CDN.
       ========================================================== -->
  <div class="wallpaper-stage" aria-hidden="true">
    <!-- Smart Fill: aktif otomatis hanya pada rasio layar ekstrem -->
    <div class="wallpaper-fill"><img class="wallpaper-fill-image" alt=""></div>
    <picture class="wallpaper-picture">

      <!-- MOBILE | 1080 x 1920 | 9:16 -->
      <source media="(max-width: 767px) and (orientation: portrait)" srcset="assets/wallpaper-mobile.jpg">

      <!-- TABLET | 1600 x 1200 | 4:3 -->
      <source media="(min-width: 768px) and (max-width: 1199px)" srcset="assets/wallpaper-tablet.jpg">

      <!-- DESKTOP / LAPTOP | 1920 x 1080 | 16:9 -->
      <img class="wallpaper-image" src="assets/wallpaper-desktop.jpg" alt="">

    </picture>
  </div>

  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- TOGGLE TEMA TERANG/GELAP -->
  <button type="button" class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleLoginTheme()" title="Ganti Tema" aria-label="Ganti tema terang/gelap">
    <svg id="loginThemeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="display:none">
      <circle cx="12" cy="12" r="4.3" fill="currentColor" stroke="none"></circle>
      <line x1="12" y1="1.5" x2="12" y2="4"></line>
      <line x1="12" y1="20" x2="12" y2="22.5"></line>
      <line x1="1.5" y1="12" x2="4" y2="12"></line>
      <line x1="20" y1="12" x2="22.5" y2="12"></line>
      <line x1="4.4" y1="4.4" x2="6.1" y2="6.1"></line>
      <line x1="17.9" y1="17.9" x2="19.6" y2="19.6"></line>
      <line x1="4.4" y1="19.6" x2="6.1" y2="17.9"></line>
      <line x1="17.9" y1="6.1" x2="19.6" y2="4.4"></line>
    </svg>
    <svg id="loginThemeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <main class="login-page">

    <section class="login-card" id="loginCard">

      <!-- BRAND -->
      <div class="brand-area">
        <div class="brand-badge">
          <span class="brand-dot"></span>
          RONT WEB APPS
        </div>

        <h1 class="brand-title">
          Selamat <strong>Datang.</strong>
        </h1>

        <p class="brand-subtitle">
          Masuk untuk mengakses dashboard operasional dan monitoring layanan.
        </p>
      </div>

      <!-- FORM -->
      <form class="login-form" onsubmit="doLogin(event); return false;" novalidate>

        <div class="field-group">

          <!-- USERNAME -->
          <div class="field-wrap">
            <label class="field-label" for="inputUsername">USERNAME</label>

            <svg class="field-icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="7.5" r="4"></circle>
              <path d="M3.5 21a8.5 6.5 0 0 1 17 0"></path>
            </svg>

            <input
              id="inputUsername"
              class="field-input"
              type="text"
              autocomplete="username"
              placeholder="Masukkan username"
              spellcheck="false"
            >
          </div>

          <!-- PASSWORD -->
          <div class="field-wrap">
            <label class="field-label" for="inputPassword">PASSWORD</label>

            <svg class="field-icon" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10.5" width="16" height="11" rx="2"></rect>
              <path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"></path>
            </svg>

            <input
              id="inputPassword"
              class="field-input"
              type="password"
              autocomplete="current-password"
              placeholder="Masukkan password"
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePasswordBtn"
              onclick="togglePassword()"
              aria-label="Tampilkan password"
              title="Tampilkan/Sembunyikan Password"
            >
              <svg id="eyeOpen" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.9"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M1.5 12C4 6.5 8 4 12 4s8 2.5 10.5 8C20 17.5 16 20 12 20S4 17.5 1.5 12Z"></path>
                <circle cx="12" cy="12" r="3.2"></circle>
              </svg>

              <svg id="eyeClosed" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.9"
                   stroke-linecap="round" stroke-linejoin="round"
                   style="display:none">
                <path d="M3.5 3.5 20.5 20.5"></path>
                <path d="M6.8 6.8C4.6 8.2 2.9 10 1.5 12.9c2.5 5.5 6.5 8 10.5 8 1.3 0 2.5-.25 3.6-.65"></path>
                <path d="M9.9 5.1A10.7 10.7 0 0 1 12 4.9c4 0 8 2.5 10.5 8a13 13 0 0 1-3 3.9"></path>
                <path d="M9.6 9.6a3.2 3.2 0 0 0 4.6 4.6"></path>
              </svg>
            </button>
          </div>

        </div>

        <!-- OPTIONS -->
        <div class="login-options">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe">
            <span class="custom-check"></span>
            <span>Ingat username</span>
          </label>

          <span class="security-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round">
              <path d="M12 3 4.5 6v5.5c0 4.6 3.1 7.8 7.5 9.5 4.4-1.7 7.5-4.9 7.5-9.5V6L12 3Z"></path>
              <path d="m8.7 12 2.1 2.1 4.5-4.7"></path>
            </svg>
            Secure Access
          </span>
        </div>

        <!-- BUTTON -->
        <button type="submit" class="btn-login" id="btnLogin">

          <span class="btn-spinner" id="btnSpinner"></span>

          <span id="btnText">Masuk ke Dashboard</span>

          <svg class="btn-arrow" id="btnArrow" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m13 6 6 6-6 6"></path>
          </svg>
        </button>

      </form>

      <!-- ALERT -->
      <div class="alert-box" id="alertBox" role="alert">
        <span id="alertIcon"></span>
        <span id="alertText"></span>
      </div>

      <!-- FOOTER -->
      <div class="card-footer">
        <span class="footer-brand">RONT WEB APPS</span>
        <span>© 2026</span>
      </div>

    </section>

  </main>


  <script>
    /* ============================================================
       MIGRASI PWA — KONFIGURASI API GAS
       ============================================================
       Ganti GAS_EXEC_URL di bawah dengan URL deployment Web App GAS
       kamu (Deploy > Manage deployments > Web app > URL, yang
       berakhiran "/exec"). URL ini SAMA dipakai di index.html.
       ============================================================ */
    const GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbzIxGwxfyOx_eiIys70uxerWAhE3bHhKdjMeZ664YfNB30na1in8muU9_d3KQGs1WJC/exec';

    // Wrapper pengganti google.script.run. Body dikirim sebagai STRING
    // JSON dengan Content-Type text/plain supaya browser tidak kirim
    // CORS preflight (GAS tidak bisa merespons preflight OPTIONS).
    async function callGAS(fn, args) {
      const res = await fetch(GAS_EXEC_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn: fn, args: args || [] })
      });

      if (!res.ok) {
        throw new Error('HTTP ' + res.status + ' dari server GAS.');
      }

      return res.json();
    }

    /* ============================================================
       UI HELPERS
       ============================================================ */

    function togglePassword() {
      const input = document.getElementById('inputPassword');
      const openIcon = document.getElementById('eyeOpen');
      const closedIcon = document.getElementById('eyeClosed');
      const btn = document.getElementById('togglePasswordBtn');

      const isPassword = input.type === 'password';

      input.type = isPassword ? 'text' : 'password';
      openIcon.style.display = isPassword ? 'none' : 'block';
      closedIcon.style.display = isPassword ? 'block' : 'none';

      btn.setAttribute(
        'aria-label',
        isPassword ? 'Sembunyikan password' : 'Tampilkan password'
      );
    }


    function showAlert(type, message) {
      const box = document.getElementById('alertBox');
      const text = document.getElementById('alertText');
      const icon = document.getElementById('alertIcon');

      box.className = 'alert-box ' + type + ' show';
      text.textContent = message;

      if (type === 'success') {
        icon.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="m8 12.3 2.7 2.7L16 9.3"></path>
          </svg>
        `;
      } else {
        icon.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v4"></path>
            <path d="M12 16h.01"></path>
          </svg>
        `;
      }
    }


    function hideAlert() {
      const box = document.getElementById('alertBox');
      box.className = 'alert-box';
    }


    function addRipple(btn, event) {
      if (!btn || !event) return;

      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement('span');

      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (event.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (event.clientY - rect.top - size / 2) + 'px';

      btn.appendChild(ripple);

      setTimeout(function() {
        ripple.remove();
      }, 700);
    }


    /* ============================================================
       TOGGLE TEMA TERANG/GELAP
       Tampilan awal SELALU light (tidak disimpan ke localStorage),
       sesuai permintaan. Ikon menunjukkan mode tujuan saat diklik.
       ============================================================ */
    function toggleLoginTheme() {
      const body = document.body;
      const iconSun = document.getElementById('loginThemeIconSun');
      const iconMoon = document.getElementById('loginThemeIconMoon');

      if (body.getAttribute('data-theme') === 'dark') {
        body.setAttribute('data-theme', 'light');
        iconSun.style.display = 'none';
        iconMoon.style.display = 'block';
      } else {
        body.setAttribute('data-theme', 'dark');
        iconSun.style.display = 'block';
        iconMoon.style.display = 'none';
      }
    }


    /* ============================================================
       LOGIN SYSTEM
       Dipertahankan kompatibel dengan Google Apps Script Anda.
       ============================================================ */

    let isSubmitting = false;

    function doLogin(e) {
      if (e) {
        e.preventDefault();
      }

      if (isSubmitting) return;

      if (e) {
        addRipple(document.getElementById('btnLogin'), e);
      }

      hideAlert();

      const username = document.getElementById('inputUsername').value.trim();
      const password = document.getElementById('inputPassword').value.trim();

      if (!username || !password) {
        showAlert('error', 'Username dan password tidak boleh kosong.');
        shakeCard();
        return;
      }

      isSubmitting = true;
      setLoading(true);

      callGAS('validateLogin', [username, password])
        .then(function(result) {
          setLoading(false);

          if (result.success) {
            showAlert('success', 'Login berhasil! Mengalihkan ke dashboard...');

            if (document.getElementById('rememberMe').checked) {
              localStorage.setItem('nimon_user', username);
            } else {
              localStorage.removeItem('nimon_user');
            }

            // MIGRASI PWA: token sesi disimpan di localStorage (dulu
            // disuntikkan lewat scriptlet <?= sessionToken ?> di
            // index.html). index.html membacanya balik dari sini.
            localStorage.setItem('ront_session_token', result.token);

            setTimeout(function() {
              // Dulu: window.top.location.href = result.redirectUrl
              // (perlu window.top karena GAS berjalan di iframe sandbox).
              // Sekarang halaman ini bukan iframe lagi -- redirect biasa
              // ke halaman dashboard statis (ganti nama file di bawah
              // kalau dashboard-mu tidak bernama index.html).
              window.location.href = 'index.html';
            }, 800);

          } else {
            isSubmitting = false;
            showAlert(
              'error',
              result.message || 'Username atau password salah.'
            );
            shakeCard();
          }
        })
        .catch(function(err) {
          isSubmitting = false;
          setLoading(false);

          showAlert(
            'error',
            'Gagal terhubung ke server. Coba lagi.'
          );

          shakeCard();
          console.error('Login error:', err);
        });
    }


    function setLoading(on) {
      const btn = document.getElementById('btnLogin');
      const spinner = document.getElementById('btnSpinner');
      const text = document.getElementById('btnText');
      const arrow = document.getElementById('btnArrow');

      btn.disabled = on;
      spinner.style.display = on ? 'block' : 'none';
      arrow.style.display = on ? 'none' : 'block';
      text.textContent = on ? 'Memeriksa akses...' : 'Masuk ke Dashboard';
    }


    function shakeCard() {
      const card = document.getElementById('loginCard');

      card.classList.remove('card-shake');
      void card.offsetWidth;
      card.classList.add('card-shake');
    }


    /* ============================================================
       PREFILL REMEMBER USERNAME
       ============================================================ */

    window.onload = function() {
      // MIGRASI PWA: kalau sudah ada token sesi tersimpan (belum logout
      // & belum expired di server), tidak perlu login ulang -- langsung
      // ke dashboard. index.html sendiri yang akan mem-validasi token
      // ini ke server tiap kali fetch data (lihat callGAS di sana),
      // jadi kalau ternyata sudah kadaluarsa, index.html yang akan
      // melempar balik ke sini.
      if (localStorage.getItem('ront_session_token')) {
        window.location.href = 'index.html';
        return;
      }

      const saved = localStorage.getItem('nimon_user');

      if (saved) {
        document.getElementById('inputUsername').value = saved;
        document.getElementById('rememberMe').checked = true;
        document.getElementById('inputPassword').focus();
      } else {
        document.getElementById('inputUsername').focus();
      }
    };
  </script>

  <script>
    /* ============================================================
       V7 RESPONSIVE FULLSCREEN WALLPAPER ENGINE
       Normal viewport memakai object-fit: cover.
       Ultra-wide/short viewport memakai fill agar logo tidak terpotong.
       3 file tetap dipilih otomatis oleh <picture> berdasarkan media query.
       Tidak ada mode contain/smart-fit yang membuat gambar terlihat
       tidak fullscreen.
       ============================================================ */
    (function () {
      const stage = document.querySelector('.wallpaper-stage');
      if (!stage) return;
      stage.classList.remove('smart-fit');
    })();
  </script>

</body>
